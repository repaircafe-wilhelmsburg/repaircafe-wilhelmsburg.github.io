<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView(
  [53.5074891785411, 9.987653195858002],
  18
);

L.tileLayer(
  'https://tiles.openfreemap.org/styles/liberty/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenFreeMap & OpenStreetMap contributors'
  }
).addTo(map);

L.marker([53.5074891785411, 9.987653195858002]).addTo(map);
</script>
</body>
</html>
