<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}

.leaflet-control-attribution {
  font-size: 10px;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
  zoomControl: true
}).setView([53.5511, 9.9937], 12);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '© OpenStreetMap'
  }
).addTo(map);

L.marker([53.5511, 9.9937]).addTo(map);
</script>
</body>
</html>
