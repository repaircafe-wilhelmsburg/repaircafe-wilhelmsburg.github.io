<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* entscheidend: absolute statt normalem Flow */
#map {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}
</style>
</head>

<body>

<div id="map"></div>

<script>
const lat = 53.5074891785411;
const lng = 9.987653195858002;

const map = L.map('map').setView([lat, lng], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

L.marker([lat, lng]).addTo(map);

setTimeout(() => {
  map.invalidateSize();
}, 200);
</script>

</body>
</html>
