<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body, #map {
  height: 98%;
  margin: 0;
}
</style>
</head>

<body>

<div id="map"></div>

<script>
const lat = 53.5074891785411;
const lng = 9.987653195858002;
const zoom = 18;

const map = L.map('map').setView([lat, lng], zoom);

// stabile Standard-Tiles (keine Styles, keine GL, keine Dependencies)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

L.marker([lat, lng]).addTo(map);
</script>

</body>
</html>
